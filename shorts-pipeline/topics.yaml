# Topic queue. `shorts run` pops the first entry; `shorts topics --fill` asks Claude for more.
- 'Claude Code /clear: a third correction in the same session makes it worse, because it keeps re-reading two failed attempts. After two failed corrections run /clear and write one better prompt that folds
  in what you learned (docs: https://code.claude.com/docs/en/best-practices)'
- 'Claude Code Esc: you do not have to wait while it goes the wrong way. Esc stops it mid-action and keeps everything up to that point; /rewind, or Esc twice on an empty prompt, opens the rewind menu (docs:
  https://code.claude.com/docs/en/best-practices)'
- 'Claude Code Stop hook: it says done while the typecheck still fails. A Stop hook runs your script whenever it tries to end its turn, and sends it back to work if the script exits with code 2 (docs: https://code.claude.com/docs/en/best-practices)'
- 'Claude Code CLAUDE.md: a long CLAUDE.md makes it worse, not better, because every line takes attention on every task. /init writes a starting version; from there the work is mostly removing lines (docs:
  https://code.claude.com/docs/en/best-practices)'
- 'Claude Code hooks: ''never edit the migrations folder'' in CLAUDE.md is a request, not a rule. A PreToolUse hook that exits with code 2 blocks the edit every time; you can ask for it in plain words:
  ''write a hook that blocks edits to the migrations folder'' (docs: https://code.claude.com/docs/en/best-practices)'
- 'Claude Code --worktree: two sessions in one folder edit the same files. `claude --worktree feature-auth` starts a session in its own checkout on its own branch, so parallel edits do not collide (docs:
  https://code.claude.com/docs/en/common-workflows)'
- 'Claude Code subagents: exploring a big codebase fills your main session with file reads. Say ''use a subagent to investigate how our auth system handles token refresh'': it reads in its own context and
  only the findings come back (docs: https://code.claude.com/docs/en/common-workflows)'
- 'Claude Code skills: your release steps do not belong in CLAUDE.md. A skill saved at .claude/skills/<name>/SKILL.md is only read in full when the task calls for it, so it does not weigh on unrelated work
  (docs: https://code.claude.com/docs/en/best-practices)'
- 'Claude Code read-only reviewer: a reviewer that can edit is not a reviewer. A subagent file in .claude/agents/ with `tools: Read, Grep, Glob` can read the code and cannot change it (docs: https://code.claude.com/docs/en/best-practices)'
- 'Claude Code /compact: a bare /compact decides for you what to keep. Give it a focus: `/compact keep the API changes and the test commands` (docs: https://code.claude.com/docs/en/best-practices)'
- 'Claude Code --continue: closing the terminal does not lose the task. `claude --continue` resumes the most recent session in that folder; `claude --resume` lets you choose from a list (docs: https://code.claude.com/docs/en/common-workflows)'
- '''Refactor this'' with no target is a demolition order: name the one smell you want gone'
- 'The agent''s ''done'' is a claim, not a result: ask for the command that proves it'
- 'Pasting the whole log buries the line that matters: paste the first error, not the last'
- '''Match the design'' fails without the design: paste the screenshot or the CSS, not the adjective'
- 'Letting the agent pick the library is how you get three HTTP clients: name the dependency or say none'
