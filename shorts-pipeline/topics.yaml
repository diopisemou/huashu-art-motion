# Topic queue. `shorts run` pops the first entry; `shorts topics --fill` asks Claude for more.
- 'Stop asking the agent ''is this correct?'': it says yes; ask what would break it'
- '''Don''t break anything'' is not an instruction: name the test that must stay green'
- '''Refactor this'' with no target is a demolition order: name the one smell you want gone'
- 'The agent''s ''done'' is a claim, not a result: ask for the command that proves it'
- 'Pasting the whole log buries the line that matters: paste the first error, not the last'
- '''Match the design'' fails without the design: paste the screenshot or the CSS, not the adjective'
- 'Letting the agent pick the library is how you get three HTTP clients: name the dependency or say none'
